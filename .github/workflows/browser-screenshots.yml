name: Browser screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'jobs/**'
      - 'accounts/**'
      - 'jobtracker/**'
      - 'requirements.txt'
      - '.github/workflows/browser-screenshots.yml'

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-browser-test-only-secret-not-for-production-123456789
      DEBUG: "True"
      GROQ_API_KEY: ""
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      VITE_API_URL: http://127.0.0.1:8000/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Django dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare local test database
        run: python manage.py migrate --noinput
      - name: Start Django
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/jobtracker-django.log 2>&1 &
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start React
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/jobtracker-vite.log 2>&1 &
      - name: Exercise real app and capture screenshots
        working-directory: frontend
        run: node tests/screenshot.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobtracker-browser-screenshots
          path: frontend/tests/screenshots/
          if-no-files-found: warn
      - name: Upload server logs if tests fail
        if: failure()
        run: |
          cat /tmp/jobtracker-django.log || true
          cat /tmp/jobtracker-vite.log || true
